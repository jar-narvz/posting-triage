<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 334" role="img" aria-labelledby="t d" font-family="Inter, Helvetica, Arial, sans-serif">
<title id="t">Eval accuracy by approach</title>
<desc id="d">Accuracy on 200 synthetic postings with known answers. Keyword baseline 55.5%. Direct prompt: Haiku 99.5%, Sonnet 94%, Opus 100%. Pipeline: 100% on Haiku, Sonnet and Opus. Whole-run cost at batch price shown per row.</desc>
<style>
.bg{fill:#fcfcfb}.ink{fill:#0b0b0b}.ink2{fill:#52514e}.grid{stroke:#e4e3df}.pipe{fill:#2a78d6}.other{fill:#b5b4ae}
@media (prefers-color-scheme: dark){.bg{fill:#1a1a19}.ink{fill:#f0efec}.ink2{fill:#c3c2b7}.grid{stroke:#383835}.pipe{fill:#3987e5}.other{fill:#6a6964}}
text{font-size:13px}.h{font-size:15px;font-weight:600}.s{font-size:12px}
</style>
<rect class="bg" width="760" height="334" rx="8"/>
<text class="ink h" x="16" y="26">Accuracy on 200 synthetic postings</text>
<text class="ink2 s" x="16" y="44">Blue = the pipeline (LLM reads, code decides). Cost = whole eval run at batch price.</text>
<line class="grid" x1="230.0" x2="230.0" y1="52" y2="294" stroke-width="1"/>
<text class="ink2 s" x="230.0" y="312" text-anchor="middle">0%</text>
<line class="grid" x1="325.0" x2="325.0" y1="52" y2="294" stroke-width="1"/>
<text class="ink2 s" x="325.0" y="312" text-anchor="middle">25%</text>
<line class="grid" x1="420.0" x2="420.0" y1="52" y2="294" stroke-width="1"/>
<text class="ink2 s" x="420.0" y="312" text-anchor="middle">50%</text>
<line class="grid" x1="515.0" x2="515.0" y1="52" y2="294" stroke-width="1"/>
<text class="ink2 s" x="515.0" y="312" text-anchor="middle">75%</text>
<line class="grid" x1="610.0" x2="610.0" y1="52" y2="294" stroke-width="1"/>
<text class="ink2 s" x="610.0" y="312" text-anchor="middle">100%</text>
<text class="ink" x="220" y="77.0" text-anchor="end">Keyword baseline (no LLM)</text>
<rect class="other" x="230" y="64" width="210.9" height="18" rx="4"/>
<text class="ink s" x="618" y="77.0">55.5%  ·  $0</text>
<text class="ink" x="220" y="111.0" text-anchor="end">Direct prompt · Haiku 5.5</text>
<rect class="other" x="230" y="98" width="378.1" height="18" rx="4"/>
<text class="ink s" x="618" y="111.0">99.5%  ·  $0.03</text>
<text class="ink" x="220" y="145.0" text-anchor="end" font-weight="600">Pipeline · Haiku 5.5 (default)</text>
<rect class="pipe" x="230" y="132" width="380.0" height="18" rx="4"/>
<text class="ink s" x="618" y="145.0">100%  ·  $0.05</text>
<text class="ink" x="220" y="179.0" text-anchor="end">Direct prompt · Sonnet 5.5</text>
<rect class="other" x="230" y="166" width="357.2" height="18" rx="4"/>
<text class="ink s" x="618" y="179.0">94%  ·  $0.17</text>
<text class="ink" x="220" y="213.0" text-anchor="end" font-weight="600">Pipeline · Sonnet 5.5</text>
<rect class="pipe" x="230" y="200" width="380.0" height="18" rx="4"/>
<text class="ink s" x="618" y="213.0">100%  ·  $0.44</text>
<text class="ink" x="220" y="247.0" text-anchor="end">Direct prompt · Opus 5.5</text>
<rect class="other" x="230" y="234" width="380.0" height="18" rx="4"/>
<text class="ink s" x="618" y="247.0">100%  ·  $0.62</text>
<text class="ink" x="220" y="281.0" text-anchor="end" font-weight="600">Pipeline · Opus 5.5</text>
<rect class="pipe" x="230" y="268" width="380.0" height="18" rx="4"/>
<text class="ink s" x="618" y="281.0">100%  ·  $0.97</text>
</svg>