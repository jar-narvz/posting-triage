[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "posting-triage"
version = "0.1.0"
description = "Triage job postings into APPLY / FLAG / SKIP / DEAD with a quoted reason."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "playwright",
    "pydantic",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
triage = "posting_triage.cli:main"

[tool.setuptools]
packages = ["posting_triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: hits a real job board or GitHub (run with -m network)",
    "browser: launches headless Chromium (run with -m browser)",
]
addopts = "-m 'not network and not browser'"
