name: docker

on:
  push:
  pull_request:

permissions:
  contents: read  # build and test only; nothing is pushed to a registry yet

jobs:
  image:
    runs-on: ubuntu-latest  # amd64, the architecture AWS will likely run
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t posting-triage:ci .
      - name: Image size
        run: |
          size=$(docker image inspect posting-triage:ci --format '{{.Size}}')
          echo "Image size: $((size / 1000000)) MB (linux/amd64)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Smoke test
        run: scripts/docker_smoke.sh posting-triage:ci
