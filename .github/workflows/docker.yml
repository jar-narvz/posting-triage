name: docker

on:
  push:
  pull_request:

permissions:
  contents: read  # build and test only; deploys run from the Mac (scripts/deploy.sh)

jobs:
  image:
    runs-on: ubuntu-24.04-arm  # arm64, the architecture Lambda runs; free for public repos
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t posting-triage:ci .
      - name: Image size
        run: |
          size=$(docker image inspect posting-triage:ci --format '{{.Size}}')
          arch=$(docker image inspect posting-triage:ci --format '{{.Os}}/{{.Architecture}}')
          echo "Image size: $((size / 1000000)) MB ($arch)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Smoke test
        run: scripts/docker_smoke.sh posting-triage:ci
